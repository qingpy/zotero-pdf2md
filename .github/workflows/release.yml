name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build-xpi.mjs addon build/zotero-pdf2md.xpi
      - uses: softprops/action-gh-release@v2
        with:
          files: build/zotero-pdf2md.xpi
          generate_release_notes: true
