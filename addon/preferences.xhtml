<groupbox>
	<label><html:h2>Markdown Conversion</html:h2></label>
	<hbox align="center">
		<label value="MinerU API token:" control="zotero-pdf2md-token"/>
		<html:input type="password" id="zotero-pdf2md-token"
			preference="extensions.zotero-pdf2md.apiToken"
			style="flex: 1; margin-left: 6px;"/>
	</hbox>
	<description>Get a free token at mineru.net/apiManage. Tokens expire after 90 days. Without a token, each PDF is limited to 10 MB and 20 pages.</description>
	<hbox align="center">
		<label value="Model:" control="zotero-pdf2md-model"/>
		<menulist id="zotero-pdf2md-model" native="true"
			preference="extensions.zotero-pdf2md.modelVersion">
			<menupopup>
				<menuitem label="VLM" value="vlm"/>
				<menuitem label="Pipeline" value="pipeline"/>
			</menupopup>
		</menulist>
		<label value="Document language:" control="zotero-pdf2md-language" style="margin-left: 12px;"/>
		<html:input type="text" id="zotero-pdf2md-language"
			preference="extensions.zotero-pdf2md.language"
			style="width: 4em;"/>
	</hbox>
	<description>Language codes: ch (Chinese and English), en (English).</description>
	<checkbox label="Recognize formulas" native="true"
		preference="extensions.zotero-pdf2md.enableFormula"/>
	<checkbox label="Recognize tables" native="true"
		preference="extensions.zotero-pdf2md.enableTable"/>
	<checkbox label="Always use OCR" native="true"
		preference="extensions.zotero-pdf2md.isOcr"/>
	<checkbox label="Convert new PDFs automatically" native="true"
		preference="extensions.zotero-pdf2md.autoConvert"/>
</groupbox>

<groupbox>
	<label><html:h2>Attachment Export</html:h2></label>
	<hbox align="center">
		<label value="Default folder:" control="zotero-pdf2md-export-dir"/>
		<html:input type="text" id="zotero-pdf2md-export-dir"
			preference="extensions.zotero-pdf2md.exportDir"
			style="flex: 1; margin-left: 6px;"/>
		<button id="zotero-pdf2md-export-choose" label="Choose…"/>
	</hbox>
	<description>Leave empty to choose a folder each time.</description>
	<checkbox label="Create a subfolder for each item" native="true"
		preference="extensions.zotero-pdf2md.exportPerItem"/>
</groupbox>
